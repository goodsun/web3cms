<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - Fullstack Serverless App</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div class="page-wrapper">
      <!-- Header will be inserted here by header.js -->
      <div class="main-content">
        <div class="container container--full">
          <main>
            <div id="settings-loading" class="message--loading">
              Loading settings...
            </div>
            <div
              id="settings-error"
              class="message message--error"
              style="display: none"
            ></div>

            <form id="settingsForm" style="display: none">
              <!-- API Configuration -->
              <section class="card card--spacing-lg">
                <h2>API Configuration</h2>

                <div class="form-group">
                  <label for="apiEndpoint">API Endpoint URL</label>
                  <input
                    type="text"
                    id="apiEndpoint"
                    name="apiEndpoint"
                    class="form-control"
                    placeholder="https://xxx.execute-api.region.amazonaws.com/stage"
                    value=""
                  />
                </div>

                <div class="form-actions">
                  <button
                    type="submit"
                    id="saveApiEndpoint"
                    class="btn btn-primary"
                  >
                    Save API Endpoint
                  </button>
                </div>
              </section>

              <!-- Web3 Configuration -->
              <section class="card card--spacing-lg">
                <h2 class="heading--section">Web3 Configuration</h2>

                <div class="form-group">
                  <label for="reownProjectId">Reown Project ID</label>
                  <input
                    type="text"
                    id="reownProjectId"
                    name="reownProjectId"
                    class="form-control"
                    placeholder="Enter your project ID from cloud.walletconnect.com"
                  />
                  <small class="form-help"
                    >Required for wallet connections</small
                  >
                </div>

                <div class="form-group">
                  <label>
                    <input
                      type="checkbox"
                      id="enableWalletConnect"
                      name="enableWalletConnect"
                    />
                    Enable Wallet Connect
                  </label>
                </div>

                <div class="form-group">
                  <label>Supported Chains</label>
                  <div class="checkbox-group">
                    <label>
                      <input type="checkbox" name="chains" value="1" />
                      Ethereum Mainnet
                    </label>
                    <label>
                      <input type="checkbox" name="chains" value="137" />
                      Polygon
                    </label>
                    <label>
                      <input type="checkbox" name="chains" value="42161" />
                      Arbitrum
                    </label>
                    <label>
                      <input type="checkbox" name="chains" value="11155111" />
                      Sepolia (Testnet)
                    </label>
                  </div>
                </div>
                <div class="form-group">
                  <label for="defaultChainId">Default Chain</label>
                  <select
                    id="defaultChainId"
                    name="defaultChainId"
                    class="form-control"
                  >
                    <option value="1">Ethereum Mainnet</option>
                    <option value="137">Polygon</option>
                    <option value="42161">Arbitrum</option>
                    <option value="11155111">Sepolia (Testnet)</option>
                  </select>
                </div>

                <br />
                <h2 class="heading--section">Features</h2>

                <div class="form-group">
                  <label>
                    <input
                      type="checkbox"
                      id="requireAuthentication"
                      name="requireAuthentication"
                    />
                    Require Authentication for CRUD Operations
                  </label>
                </div>

                <div class="form-group">
                  <label>
                    <input
                      type="checkbox"
                      id="maintenanceMode"
                      name="maintenanceMode"
                    />
                    Maintenance Mode
                  </label>
                  <small class="form-help"
                    >When enabled, only admins can access the application</small
                  >
                </div>

                <br />
                <h2 class="heading--section">Administrator Settings</h2>
                <div class="form-group">
                  <label for="adminAddresses">Admin Wallet Addresses</label>
                  <textarea
                    id="adminAddresses"
                    name="adminAddresses"
                    rows="4"
                    class="form-control"
                    placeholder="Enter wallet addresses, one per line&#10;0x1234...&#10;0x5678..."
                  ></textarea>

                    <button type="submit" class="btn btn--primary">
                    Save Settings
                    </button>
                    <button
                    type="button"
                    class="btn btn--secondary"
                    onclick="loadSettings()"
                    >
                    Reset
                </button>
              </section>
              </div>
            </form>
          </main>
        </div>
      </div>

      <footer>
        <p>Settings are stored in DynamoDB and applied in real-time</p>
      </footer>
    </div>

    <script src="js/api-config.js"></script>
    <script src="js/config.js"></script>
    <script src="js/header.js"></script>
    <script src="js/settings.js"></script>
  </body>
</html>
