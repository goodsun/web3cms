<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullstack Serverless App</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Header will be inserted here by header.js -->
        <div class="main-content">
            <div class="container">
                <main>
            <!-- Create/Update Form -->
            <section class="card card--spacing-lg">
                <h2 class="heading--section">Add/Update Item</h2>
                <form id="itemForm">
                    <input type="hidden" id="itemId" name="id">
                    
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Description:</label>
                        <textarea id="description" name="description" rows="3" class="form-control"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="category">Category:</label>
                        <input type="text" id="category" name="category" class="form-control">
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" id="submitBtn" class="btn btn--primary btn--full">Add Item</button>
                        <button type="button" id="cancelBtn" class="btn btn--secondary" style="display: none;">Cancel</button>
                    </div>
                </form>
            </section>

            <!-- Items List -->
            <section class="card">
                <h2 class="heading--section">Items List</h2>
                <div id="loading" class="message--loading">Loading...</div>
                <div id="error" class="message message--error" style="display: none;"></div>
                <div id="itemsList" class="grid grid--auto-fill"></div>
            </section>
                </main>
            </div>
        </div>

        <footer>
            <p>Powered by AWS CDK, Lambda, API Gateway & DynamoDB</p>
        </footer>
    </div>

    <script src="js/api-config.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/header.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
