name: Deploy to AWS

on:
  push:
    branches:
      - develop
      - staging
      - production
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Maximum 30 minutes for the entire job
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install root dependencies
      run: npm ci

    - name: Install frontend dependencies
      run: cd frontend && npm ci

    - name: Build backend
      run: npm run build

    # Frontend build is now handled by deploy-with-config.sh after API URL is available

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}

    - name: Set up environment
      run: |
        echo "PROJECT_NAME=${{ secrets.PROJECT_NAME }}" >> .env
        echo "AWS_REGION=${{ secrets.AWS_REGION || 'ap-northeast-1' }}" >> .env

    - name: CDK Bootstrap (if needed)
      run: |
        npx cdk bootstrap || echo "Bootstrap already exists"

    - name: Check CloudFormation stack status
      if: github.ref == 'refs/heads/develop'
      run: |
        STACK_NAME="Web3cms-Dev"
        STACK_STATUS=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "DOES_NOT_EXIST")
        echo "Current stack status: $STACK_STATUS"
        
        if [[ "$STACK_STATUS" == *"IN_PROGRESS"* ]]; then
          echo "Stack is in progress state. Waiting for completion..."
          aws cloudformation wait stack-update-complete --stack-name $STACK_NAME || true
          aws cloudformation wait stack-create-complete --stack-name $STACK_NAME || true
        fi

    - name: Deploy to dev (develop branch)
      if: github.ref == 'refs/heads/develop'
      env:
        PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
        AWS_REGION: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}
      run: |
        echo "Environment: dev"
        echo "Running direct CDK deployment"
        npm run deploy:dev

    - name: Check CloudFormation stack status (staging)
      if: github.ref == 'refs/heads/staging'
      run: |
        STACK_NAME="Web3cms-Staging"
        STACK_STATUS=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "DOES_NOT_EXIST")
        echo "Current stack status: $STACK_STATUS"
        
        if [[ "$STACK_STATUS" == *"IN_PROGRESS"* ]]; then
          echo "Stack is in progress state. Waiting for completion..."
          aws cloudformation wait stack-update-complete --stack-name $STACK_NAME || true
          aws cloudformation wait stack-create-complete --stack-name $STACK_NAME || true
        fi

    - name: Deploy to staging (staging branch)
      if: github.ref == 'refs/heads/staging'
      env:
        PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
        AWS_REGION: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}
      run: |
        echo "Environment: staging"
        npm run deploy:staging

    - name: Check CloudFormation stack status (production)
      if: github.ref == 'refs/heads/production'
      run: |
        STACK_NAME="Web3cms-Prod"
        STACK_STATUS=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "DOES_NOT_EXIST")
        echo "Current stack status: $STACK_STATUS"
        
        if [[ "$STACK_STATUS" == *"IN_PROGRESS"* ]]; then
          echo "Stack is in progress state. Waiting for completion..."
          aws cloudformation wait stack-update-complete --stack-name $STACK_NAME || true
          aws cloudformation wait stack-create-complete --stack-name $STACK_NAME || true
        fi

    - name: Deploy to prod (production branch)
      if: github.ref == 'refs/heads/production'
      env:
        PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
        AWS_REGION: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}
      run: |
        echo "Environment: production"
        npm run deploy:prod

    - name: Show deployment outputs
      run: |
        echo "Deployment completed!"
        echo "Check AWS CloudFormation console for stack outputs"