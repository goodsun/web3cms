name: Deploy to AWS

on:
  push:
    branches:
      - develop
      - staging
      - production
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install root dependencies
      run: npm ci

    - name: Install frontend dependencies
      run: cd frontend && npm ci

    - name: Build backend
      run: npm run build

    # Frontend build is now handled by deploy-with-config.sh after API URL is available

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}

    - name: Set up environment
      run: |
        echo "PROJECT_NAME=${{ secrets.PROJECT_NAME }}" >> .env
        echo "AWS_REGION=${{ secrets.AWS_REGION || 'ap-northeast-1' }}" >> .env

    - name: CDK Bootstrap (if needed)
      run: |
        npx cdk bootstrap || echo "Bootstrap already exists"

    - name: Deploy to dev (develop branch)
      if: github.ref == 'refs/heads/develop'
      run: |
        echo "Environment: dev"
        echo "Using deploy-with-config.sh for proper deployment order"
        ./scripts/deploy-with-config.sh dev

    - name: Deploy to staging (staging branch)
      if: github.ref == 'refs/heads/staging'
      run: |
        echo "Environment: staging"
        ./scripts/deploy-with-config.sh staging

    - name: Deploy to prod (production branch)
      if: github.ref == 'refs/heads/production'
      run: |
        echo "Environment: production"
        ./scripts/deploy-with-config.sh prod

    - name: Show deployment outputs
      run: |
        echo "Deployment completed!"
        echo "Check AWS CloudFormation console for stack outputs"