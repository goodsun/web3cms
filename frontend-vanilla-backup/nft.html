<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My NFTs - Web3CMS</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/nft.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="container">
            <div class="main-layout">
                <main>
                    <!-- NFT Gallery -->
                    <section class="card card--spacing-lg">
                        <h1 class="heading--page">My NFTs</h1>
                        
                        <!-- Connection Status -->
                        <div id="connectionStatus" class="connection-status">
                            <div class="message message--info">
                                Please connect your wallet to view your NFTs
                            </div>
                        </div>

                        <!-- NFT Controls -->
                        <div id="nftControls" class="nft-controls" style="display: none;">
                            <div class="control-group">
                                <label for="nftSource">Data Source:</label>
                                <select id="nftSource" class="form-control">
                                    <option value="opensea">OpenSea API (Fast)</option>
                                    <option value="onchain">On-chain (Accurate)</option>
                                </select>
                            </div>
                            <button id="refreshNFTs" class="btn btn--primary">Refresh NFTs</button>
                        </div>

                        <!-- Loading State -->
                        <div id="loading" class="message--loading" style="display: none;">
                            Loading your NFTs...
                        </div>

                        <!-- Error Message -->
                        <div id="error" class="message message--error" style="display: none;"></div>

                        <!-- NFT Grid -->
                        <div id="nftGrid" class="nft-grid"></div>
                    </section>

                    <!-- Transfer Modal -->
                    <div id="transferModal" class="modal" style="display: none;">
                        <div class="modal-content">
                            <span class="modal-close" id="closeModal">&times;</span>
                            <h2>Transfer NFT</h2>
                            <div id="transferNFTInfo" class="nft-info"></div>
                            <form id="transferForm" class="transfer-form">
                                <div class="form-group">
                                    <label for="recipientAddress">Recipient Address:</label>
                                    <input 
                                        type="text" 
                                        id="recipientAddress" 
                                        class="form-control" 
                                        placeholder="0x..." 
                                        required
                                        pattern="^0x[a-fA-F0-9]{40}$"
                                    >
                                    <small class="form-help">Enter the Ethereum address to send this NFT to</small>
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="btn btn--primary">Transfer NFT</button>
                                    <button type="button" class="btn btn--secondary" id="cancelTransfer">Cancel</button>
                                </div>
                            </form>
                            <div id="transferStatus" class="transfer-status"></div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <footer>
            <p id="footerText">Powered by AWS CDK, Lambda, API Gateway & DynamoDB</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="js/api-config.js"></script>
    <script src="js/config.js"></script>
    <script src="js/site-config.js"></script>
    <script src="js/header.js"></script>
    <script type="module" src="js/nft-page.js"></script>
</body>
</html>
